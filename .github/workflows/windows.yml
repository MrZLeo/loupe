name: Windows

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  BUILD_TYPE: Release
  INSTALL_LOCATION: ".local"
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

jobs:
  build:

    runs-on: windows-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')"

    steps:
    - uses: actions/checkout@v7

    - name: cache CPM downloads
      uses: actions/cache@v6
      with:
        path: ${{ env.CPM_SOURCE_CACHE }}
        key: ${{ runner.os }}-cpm-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'test/**') }}

    - name: set up msvc toolchain
      uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
      with:
        arch: x64

    - name: install ninja
      run: choco install ninja --yes --no-progress

    - name: configure
      run: cmake -Bbuild -G Ninja -DCMAKE_BUILD_TYPE="$env:BUILD_TYPE" -DCMAKE_INSTALL_PREFIX="$HOME/$env:INSTALL_LOCATION" -DCPM_SOURCE_CACHE="$env:CPM_SOURCE_CACHE"
      
    - name: build
      run: cmake --build build -j4

    - name: run tests
      run: |
        cd build
        ctest -VV

    - name: install project
      run: cmake --build build --target install 
